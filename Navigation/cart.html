<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--GOOGLE FONTS-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

    <title>Bite Cart</title>
    <!--CSS-->
    <link rel="stylesheet" href="../CSS/cart.css" />
    <!--FAVICON-->
    <link rel="icon" type="image/x-icon" href="../image/favicon/favicon.ico" />
    <style>
      li {
        list-style-type: none;
      }
    </style>
    <script
      src="https://kit.fontawesome.com/5f33b3b7aa.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!--Start Header section-->
     <header>
      <nav>
        <!-- Logo -->
        <img src="../image/biteboxlogo.png" alt="BiteBox Logo" />
        <!--Menu-->
        <ul>
          <li><a href="index.html" class="active">Home</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="BiteDeals.html">Bite Deals</a></li>
          <li>
            <a href="cart.html"><i class="fa-solid fa-basket-shopping"></i></a>
          </li>
          <li>
            <a href="Login.html"
              ><i class="fa-solid fa-arrow-right-to-bracket"></i
            ></a>
          </li>
        </ul>
      </nav>
    </header>
    <!--End Header section-->

    <!--Cart Setion-->
    <section class="cart">
        <table>
            <thead>
                <th>Item</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Total</th>
                <th>Remove</th>
            </thead>
            <tbody>
                <tr>
                    <td class="item">
                        <img src="../image/mpizza-card2.png">
                        <div>
                            <h4>Margerita Pizza</h4>
                            <p>Classic Pizza Margerita</p>
                        </div>
                    </td>
                        <td>Rs. 249</td>
                    <td>
                        <div class="qty-box">
                            <button></button>
                            <span>1</span>
                            <button>+</button>
                        </div>
                    </td>
                        <td><button class="remove">✖</button></td>
                </tr>

                <tr>
                    <td class="item">
                        <img src="../image/burger-card1.png">
                        <div>
                            <h4>Cheese Burger</h4>
                            <p>Juicy grilled Burger</p>
                        </div>
                    </td>
                        <td>Rs. 199</td>
                    <td>
                        <div class="qty-box">
                            <button></button>
                            <span>1</span>
                            <button>+</button>
                        </div>
                    </td>
                        <td><button class="remove">✖</button></td>
                </tr>

                <tr>
                    <td class="item">
                        <img src="../image/apasta-card4.jpg">
                        <div>
                            <h4>Alfredo Pasta</h4>
                            <p>White sauce Pasta</p>
                        </div>
                    </td>
                        <td>Rs. 199</td>
                    <td>
                        <div class="qty-box">
                            <button></button>
                            <span>1</span>
                            <button>+</button>
                        </div>
                    </td>
                        <td><button class="remove">✖</button></td>
                </tr>
                <tr class="grand-total">
                    <td colspan="3">Grand Total</td>
                    <td>Rs. 199</td>
                    <td><button>Proceed</button></td>
                </tr>
                
            </tbody>

        </table>
    </section>
        <!--End Cart Setion-->
  </body>
</html>
